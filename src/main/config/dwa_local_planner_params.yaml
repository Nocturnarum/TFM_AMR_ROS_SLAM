DWAPlannerROS:
  # Limites del robot (61 RPM, r=0.0325 m) con algo de margen
  max_vel_x: 0.18
  min_vel_x: -0.05
  max_vel_y: 0.0          # diferencial: no se mueve lateral
  min_vel_y: 0.0
  max_vel_trans: 0.18
  min_vel_trans: 0.03
  max_vel_theta: 1.0
  min_vel_theta: 0.4
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5

  # Llegada al objetivo
  xy_goal_tolerance: 0.05
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true

  # Simulacion de trayectorias
  sim_time: 1.5
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20
  controller_frequency: 10.0

  # Pesos
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.2
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05

  holonomic_robot: false
